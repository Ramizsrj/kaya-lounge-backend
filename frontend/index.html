function t(key){ return (strings[state.lang] && strings[state.lang][key]) || strings.en[key] || key; }

// When this page is served by the backend itself (the normal browser/PWA
// case), relative paths like "/api/rewards" already point at the right
// place. When this same file is bundled inside a native app shell
// (Capacitor), there's no backend at that origin, so a real server address
// must be supplied via window.KAYA_API_BASE before this script runs — see
// mobile-app/www/index.html.
const API_BASE=(typeof window!=='undefined' && window.KAYA_API_BASE) || '';

async function api(path, method, body, token){
  const headers={'Content-Type':'application/json'};
  if(token) headers['Authorization']='Bearer '+token;
  let res;
  try{
    res=await fetch(API_BASE+path, { method: method||'GET', headers, body: body?JSON.stringify(body):undefined });
  }catch(e){
    // A raw "Failed to fetch" almost always means the backend server isn't
    // running or isn't reachable right now — this page can still load from
    // the service worker cache even when the server behind it is down, so
    // that confusing default browser message needs replacing with something
    // actionable.
    state.serverUnreachable=true;
    throw new Error("Can't reach the server right now. If the app has been idle for a while, the server may just be waking up — please wait a few seconds and try again.");
  }
  state.serverUnreachable=false;
  let data={};
  try{ data=await res.json(); }catch(e){}
  if(!res.ok) throw new Error(data.error || 'Something went wrong');
  return data;
}

function actionLabel(a){
  return {scan:'Card scanned', stamp_added:'Stamp added', stamp_removed:'Stamp removed', reward_redeemed:'Reward redeemed', card_created:'New card created', password_reset:'Password reset'}[a] || a;
}

async function loadRewards(){
  try{ state.rewards = await api('/api/rewards'); state.serverUnreachable=false; }
  catch(e){ state.rewards=[]; state.serverUnreachable=true; }
}

async function loadMenu(){
  try{ state.menuItems = await api('/api/menu'); }
  catch(e){ state.menuItems=[]; }
}

async function loadMyOrders(){
  const token=localStorage.getItem('kayaCustomerToken');
  try{ state.myOrders = await api('/api/orders','GET',null,token); }
  catch(e){ state.myOrders=[]; }
}

async function loadStaffOrders(){
  try{ state.staffOrders = await api('/api/staff/orders','GET',null,state.staffToken); }
  catch(e){ state.staffOrders=[]; }
}

async function loadStaffService(){
  try{ state.staffServiceRequests = await api('/api/staff/service','GET',null,state.staffToken); }
  catch(e){ state.staffServiceRequests=[]; }
}

async function requestService(type){
  state.serviceBusy=type; state.serviceMsg=''; render();
  try{
    await api('/api/service','POST',{tableNumber:state.tableNumber, type});
    state.serviceMsg = type==='waiter' ? 'Staff have been notified — a waiter is on the way.' : 'Staff have been notified — your bill is on the way.';
  }catch(err){
    state.serviceMsg = err.message;
  }
  state.serviceBusy='';
  render();
}

let suppressHistoryPush=false;

// Polls for pending "call waiter" / "request bill" requests AND freshly
// placed food orders while staff is logged in, so a red alert shows up on
// every staff screen automatically — staff shouldn't have to remember to
// check the Service requests / Live orders pages. Stays red until the item
// is actually acknowledged (order moved past "placed", or request marked done).
let staffAlertPollTimer=null;
async function pollStaffAlerts(){
  if(!state.staffToken) return;
  try{
    const reqs=await api('/api/staff/service','GET',null,state.staffToken);
    state.pendingServiceCount=reqs.length;
    state.staffServiceRequests=reqs;
  }catch(e){ /* ignore transient errors while polling */ }
  try{
    const orders=await api('/api/staff/orders','GET',null,state.staffToken);
    state.staffOrders=orders;
    state.pendingOrderCount=orders.filter(o=>o.status==='placed').length;
  }catch(e){ /* ignore transient errors while polling */ }
  render();
}
function startStaffAlertPolling(){
  stopStaffAlertPolling();
  pollStaffAlerts();
  staffAlertPollTimer=setInterval(pollStaffAlerts, 6000);
}
function stopStaffAlertPolling(){
  if(staffAlertPollTimer){ clearInterval(staffAlertPollTimer); staffAlertPollTimer=null; }
  state.pendingServiceCount=0; state.pendingOrderCount=0;
}

function render(){
  const el=document.getElementById('screen');
  const views={ landing:renderLanding, signup:renderSignup, login:renderLogin, wallet:renderWallet, added:renderAdded,
    staffLogin:renderStaffLogin, staffLookup:renderStaffLookup, staffMember:renderStaffMember, staffRewards:renderStaffRewards,
    adminLogin:renderAdminLogin, adminPanel:renderAdminPanel,
    tableEntry:renderTableEntry, menu:renderMenu, category:renderCategory, cart:renderCart, checkout:renderCheckout,
    orderPlaced:renderOrderPlaced, myOrders:renderMyOrders,
    staffOrders:renderStaffOrders, staffService:renderStaffService };
  const banner = state.serverUnreachable
    ? `<div style="background:#3a1414;border-bottom:1px solid ${theme.ruby};padding:10px 14px;text-align:center">
        <p style="color:#ff9a7a;font-size:11px;font-weight:700;margin:0 0 2px">⚠️ Can't reach the app's server</p>
        <p style="color:#f0c9bd;font-size:10px;margin:0">The server may just be waking up from being idle — wait a few seconds, then <a href="javascript:location.reload()" style="color:#fff;text-decoration:underline">refresh this page</a>.</p>
      </div>`
    : '';
  const staffAlertSteps=['staffLookup','staffMember','staffRewards','staffOrders','staffService'];
  const orderAlertBanner = (state.staffToken && state.pendingOrderCount>0 && staffAlertSteps.includes(state.step) && state.step!=='staffOrders')
    ? `<div id="orderAlertBanner" class="btn" style="background:#3a1414;border-bottom:2px solid #e23c3c;padding:12px 14px;text-align:center;animation:kayaPulse 1.3s ease-in-out infinite">
        <p style="color:#ff5a5a;font-size:13px;font-weight:800;margin:0">🔴 ${state.pendingOrderCount} new order${state.pendingOrderCount>1?'s':''} — tap here</p>
      </div>`
    : '';
  const serviceBanner = (state.staffToken && state.pendingServiceCount>0 && staffAlertSteps.includes(state.step) && state.step!=='staffService')
    ? `<div id="serviceAlertBanner" class="btn" style="background:#3a1414;border-bottom:2px solid #e23c3c;padding:12px 14px;text-align:center;animation:kayaPulse 1.3s ease-in-out infinite">
        <p style="color:#ff5a5a;font-size:13px;font-weight:800;margin:0">🔴 ${state.pendingServiceCount} table${state.pendingServiceCount>1?'s':''} waiting — tap here</p>
      </div>`
    : '';
  el.innerHTML=banner+orderAlertBanner+serviceBanner+views[state.step]();
  bind();

  // Wire the phone/browser's own Back button (and swipe-back gesture) to
  // step backward through the app's screens instead of leaving the page.
  if(!suppressHistoryPush){
    if(!history.state){
      history.replaceState({step:state.step}, '', '');
    }else if(history.state.step!==state.step){
      history.pushState({step:state.step}, '', '');
    }
  }
  suppressHistoryPush=false;
}

});

function renderQr(nameSeed){
  // decorative pseudo-QR pattern for the demo — not a real scannable code
  let cells='';
  const seed = (nameSeed||'kaya').split('').reduce((a,c)=>a+c.charCodeAt(0),0);
  let s = seed;
  function rnd(){ s = (s*9301+49297)%233280; return s/233280; }
  for(let i=0;i<121;i++){
    const on = i<11 || i%11===0 || i%11===10 || i>=110 || (i>21 && i<99 && rnd()>0.55);
    cells += `<div style="width:100%;padding-top:100%;background:${on?'#241a12':'transparent'}"></div>`;
  }
  return `<div style="display:grid;grid-template-columns:repeat(11,1fr);gap:1px;width:180px;height:180px;background:#fff;padding:10px;border-radius:8px;margin:0 auto">${cells}</div>`;
}

function bind(){
  const q=id=>document.getElementById(id);

  if(q('startSignup')) q('startSignup').onclick=()=>{state.signupError='';state.step='signup';render();};
  if(q('backToLandingFromSignup')) q('backToLandingFromSignup').onclick=()=>{state.signupError='';state.step='landing';render();};
  if(q('createCard')) q('createCard').onclick=async ()=>{
    const name=(q('nameInput').value||'').trim();
    const password=(q('passwordInput').value||'').trim();
    const phone=(q('phoneInput').value||'').trim();
    if(!name || !password){ state.signupError='Name and password are required'; render(); return; }
    try{
      const res=await api('/api/customer/signup','POST',{name,password,phone});
      localStorage.setItem('kayaCustomerToken', res.token);
      state.member=res.member; state.signupError=''; state.step='wallet';
    }catch(err){ state.signupError=err.message; }
    render();
  };

  if(q('goToLogin')) q('goToLogin').onclick=()=>{state.loginError='';state.step='login';render();};
  if(q('backToLandingFromLogin')) q('backToLandingFromLogin').onclick=()=>{state.loginError='';state.step='landing';render();};
  if(q('loginSubmit')) q('loginSubmit').onclick=async ()=>{
    const name=(q('loginNameInput').value||'').trim();
    const password=(q('loginPasswordInput').value||'').trim();
    try{
      const res=await api('/api/customer/login','POST',{name,password});
      localStorage.setItem('kayaCustomerToken', res.token);
      state.member=res.member; state.loginError=''; state.step='wallet';
    }catch(err){ state.loginError=err.message; }
    render();
  };
  if(q('loginPasswordInput')) q('loginPasswordInput').onkeydown=(e)=>{ if(e.key==='Enter') q('loginSubmit').click(); };

  if(q('addApple')) q('addApple').onclick=()=>{state.walletAdded='apple';state.walletAddedLabel='Apple Wallet';state.step='added';render();};
  if(q('addGoogle')) q('addGoogle').onclick=()=>{state.walletAdded='google';state.walletAddedLabel='Google Wallet';state.step='added';render();};
  if(q('backToWallet')) q('backToWallet').onclick=()=>{state.step='wallet';render();};
  if(q('customerLogout')) q('customerLogout').onclick=()=>{
    localStorage.removeItem('kayaCustomerToken');
    state.member=null; state.step='landing'; render();
  };

  // ---------------- Ordering: table entry / menu / category ----------------

  if(q('orderFood')) q('orderFood').onclick=()=>{
    state.tableInputError='';
    state.step = state.tableNumber ? 'menu' : 'tableEntry';
    if(state.step==='menu') loadMenu().then(render);
    render();
  };
  if(q('viewMyOrders')) q('viewMyOrders').onclick=async ()=>{
    state.step='myOrders'; render();
    await loadMyOrders(); render();
  };
  if(q('backToWalletFromTable')) q('backToWalletFromTable').onclick=()=>{state.step='wallet';render();};
  if(q('startOrdering')) q('startOrdering').onclick=async ()=>{
    const val=(q('tableNumberInput').value||'').trim();
    if(!val){ state.tableInputError='Enter your table number'; render(); return; }
    state.tableNumber=val; state.tableInputError=''; state.step='menu';
    render();
    await loadMenu(); render();
  };
  if(q('tableNumberInput')) q('tableNumberInput').onkeydown=(e)=>{ if(e.key==='Enter') q('startOrdering').click(); };

  if(q('toggleLang')) q('toggleLang').onclick=()=>{
    state.lang = state.lang==='en' ? 'ur' : 'en';
    localStorage.setItem('kayaLang', state.lang);
    render();
  };
  if(q('goToMyCard')) q('goToMyCard').onclick=()=>{state.step='wallet';render();};
  if(q('backToWalletFromMenu')) q('backToWalletFromMenu').onclick=()=>{state.step='wallet';render();};
  document.querySelectorAll('[data-category]').forEach(el=>{
    el.onclick=()=>{ state.currentCategory=el.dataset.category; state.step='category'; render(); };
  });
  if(q('backToMenu')) q('backToMenu').onclick=()=>{state.step='menu';render();};

  if(q('callWaiterBtn')) q('callWaiterBtn').onclick=()=>requestService('waiter');
  if(q('requestBillBtn')) q('requestBillBtn').onclick=()=>requestService('bill');

  document.querySelectorAll('[data-add-item]').forEach(btn=>{
    btn.onclick=()=>{
      const id=parseInt(btn.dataset.addItem,10);
      const item=state.menuItems.find(m=>m.id===id);
      if(!item) return;
      const existing=state.cart.find(c=>c.menuItemId===id);
      if(existing) existing.quantity++;
      else state.cart.push({menuItemId:id,name:item.name,price:item.price,quantity:1});
      render();
    };
  });

  if(q('viewCartBar')) q('viewCartBar').onclick=()=>{state.step='cart';render();};

  // ---------------- Cart / checkout ----------------

  document.querySelectorAll('[data-cart-plus]').forEach(btn=>{
    btn.onclick=()=>{
      const id=parseInt(btn.dataset.cartPlus,10);
      const line=state.cart.find(c=>c.menuItemId===id);
      if(line) line.quantity++;
      render();
    };
  });
  document.querySelectorAll('[data-cart-minus]').forEach(btn=>{
    btn.onclick=()=>{
      const id=parseInt(btn.dataset.cartMinus,10);
      const line=state.cart.find(c=>c.menuItemId===id);
      if(line){ line.quantity--; if(line.quantity<=0) state.cart=state.cart.filter(c=>c.menuItemId!==id); }
      render();
    };
  });
  if(q('changeTableLink')) q('changeTableLink').onclick=()=>{
    state.cart=[]; state.tableNumber=''; state.step='tableEntry'; render();
  };
  if(q('proceedCheckout')) q('proceedCheckout').onclick=()=>{
    if(state.cart.length===0) return;
    state.step='checkout'; render();
  };
  if(q('backToMenuFromCart')) q('backToMenuFromCart').onclick=()=>{state.step='menu';render();};

  if(q('backToCartFromCheckout')) q('backToCartFromCheckout').onclick=()=>{state.step='cart';render();};
  if(q('placeOrderBtn')) q('placeOrderBtn').onclick=async ()=>{
    state.promoCode=(q('promoInput').value||'').trim();
    state.orderNotes=(q('orderNotesInput').value||'').trim();
    const token=localStorage.getItem('kayaCustomerToken');
    try{
      const body={
        tableNumber: state.tableNumber,
        items: state.cart.map(c=>({menuItemId:c.menuItemId, quantity:c.quantity})),
        notes: state.orderNotes,
        promoCode: state.promoCode || undefined
      };
      const res=await api('/api/orders','POST',body,token);
      state.lastOrder=res.order; state.orderError=''; state.promoError=''; state.cart=[];
      state.step='orderPlaced';
    }catch(err){
      if(/promo/i.test(err.message)){ state.promoError=err.message; } else { state.orderError=err.message; }
    }
    render();
  };

  if(q('startNewOrderBtn')) q('startNewOrderBtn').onclick=async ()=>{
    state.step='menu'; render();
    await loadMenu(); render();
  };
  if(q('backToWalletFromPlaced')) q('backToWalletFromPlaced').onclick=()=>{state.step='wallet';render();};

  if(q('backToWalletFromOrders')) q('backToWalletFromOrders').onclick=()=>{state.step='wallet';render();};
  document.querySelectorAll('[data-rate]').forEach(el=>{
    el.onclick=async ()=>{
      const [orderId,n]=el.dataset.rate.split(':').map(Number);
      state.ratingBusy=orderId; render();
      const token=localStorage.getItem('kayaCustomerToken');
      try{ await api('/api/orders/'+orderId+'/rating','POST',{rating:n},token); }catch(e){}
      state.ratingBusy=null;
      await loadMyOrders(); render();
    };
  });

  // ---------------- Staff: live orders / service requests ----------------

  if(q('goToStaffOrders')) q('goToStaffOrders').onclick=async ()=>{
    state.step='staffOrders'; render();
    await loadStaffOrders(); render();
  };
  if(q('goToStaffService')) q('goToStaffService').onclick=async ()=>{
    state.step='staffService'; render();
    await loadStaffService(); render();
  };
  if(q('backToLookupFromOrders')) q('backToLookupFromOrders').onclick=()=>{state.step='staffLookup';render();};
  if(q('backToLookupFromService')) q('backToLookupFromService').onclick=()=>{state.step='staffLookup';render();};
  document.querySelectorAll('[data-advance-order]').forEach(btn=>{
    btn.onclick=async ()=>{
      const [id,status]=btn.dataset.advanceOrder.split(':');
      await api('/api/staff/orders/'+id+'/status','PATCH',{status},state.staffToken);
      await loadStaffOrders(); render();
    };
  });
  document.querySelectorAll('[data-resolve-service]').forEach(btn=>{
    btn.onclick=async ()=>{
      await api('/api/staff/service/'+btn.dataset.resolveService,'PATCH',null,state.staffToken);
      await loadStaffService(); render();
    };
  });

  if(q('staffLink')) q('staffLink').onclick=()=>{state.staffError='';state.step='staffLogin';render();};
  if(q('staffCancel')) q('staffCancel').onclick=()=>{state.step=state.member?'wallet':'landing';render();};
  if(q('staffSubmit')) q('staffSubmit').onclick=async ()=>{
    const name=(q('staffNameInput').value||'').trim();
    const pin=(q('staffPin').value||'').trim();
    try{
      const res=await api('/api/staff/login','POST',{name,pin});
      localStorage.setItem('kayaStaffToken', res.token);
      localStorage.setItem('kayaStaffName', res.staffName);
      state.staffToken=res.token; state.staffName=res.staffName; state.staffError=''; state.lookupError='';
      state.step='staffLookup';
      startStaffAlertPolling();
    }catch(err){ state.staffError=err.message; }
    render();
  };
  if(q('staffPin')) q('staffPin').onkeydown=(e)=>{ if(e.key==='Enter') q('staffSubmit').click(); };
  if(q('staffLogout')) q('staffLogout').onclick=()=>{
    localStorage.removeItem('kayaStaffToken'); localStorage.removeItem('kayaStaffName');
    state.staffToken=null; state.staffName=''; state.step='landing';
    stopStaffAlertPolling();
    render();
  };
  if(q('serviceAlertBanner')) q('serviceAlertBanner').onclick=async ()=>{
    state.step='staffService'; render();
    await loadStaffService(); render();
  };
  if(q('orderAlertBanner')) q('orderAlertBanner').onclick=async ()=>{
    state.step='staffOrders'; render();
    await loadStaffOrders(); render();
  };

  if(q('lookupSubmit')) q('lookupSubmit').onclick=async ()=>{
    const num=(q('cardNumberInput').value||'').trim().toUpperCase();
    try{
      const res=await api('/api/staff/members/'+encodeURIComponent(num),'GET',null,state.staffToken);
      state.activeCard=num; state.activeMember=res.member; state.lookupError=''; state.step='staffMember';
    }catch(err){ state.lookupError=err.message; }
    render();
  };
  if(q('cardNumberInput')) q('cardNumberInput').onkeydown=(e)=>{ if(e.key==='Enter') q('lookupSubmit').click(); };
  if(q('backToLookup')) q('backToLookup').onclick=()=>{state.lookupError='';state.step='staffLookup';render();};
  if(q('manageRewards')) q('manageRewards').onclick=()=>{state.step='staffRewards';render();};

  if(q('staffAddStamp')) q('staffAddStamp').onclick=async ()=>{
    const res=await api('/api/staff/members/'+encodeURIComponent(state.activeCard)+'/stamp','POST',{delta:1},state.staffToken);
    state.activeMember=res.member; render();
  };
  if(q('staffRemoveStamp')) q('staffRemoveStamp').onclick=async ()=>{
    const res=await api('/api/staff/members/'+encodeURIComponent(state.activeCard)+'/stamp','POST',{delta:-1},state.staffToken);
    state.activeMember=res.member; render();
  };
  document.querySelectorAll('[data-redeem]').forEach(btn=>{
    btn.onclick=async ()=>{
      const stamps=parseInt(btn.dataset.redeem,10);
      const res=await api('/api/staff/members/'+encodeURIComponent(state.activeCard)+'/redeem','POST',{stamps},state.staffToken);
      state.activeMember=res.member; render();
    };
  });

  if(q('addReward')) q('addReward').onclick=async ()=>{
    const stamps=parseInt(q('newRewardStamps').value,10);
    const label=(q('newRewardLabel').value||'').trim();
    if(stamps>0 && label){
      await api('/api/staff/rewards','POST',{stamps,label},state.staffToken);
      await loadRewards();
      render();
    }
  };
  document.querySelectorAll('[data-remove-reward]').forEach(btn=>{
    btn.onclick=async ()=>{
      await api('/api/staff/rewards/'+btn.dataset.removeReward,'DELETE',null,state.staffToken);
      await loadRewards();
      render();
    };
  });

  if(q('adminLinkLanding')) q('adminLinkLanding').onclick=()=>{state.adminError='';state.step='adminLogin';render();};
  if(q('adminCancel')) q('adminCancel').onclick=()=>{state.step='landing';render();};
  if(q('adminSubmit')) q('adminSubmit').onclick=async ()=>{
    const pin=(q('adminPin').value||'').trim();
    try{
      const res=await api('/api/admin/login','POST',{pin});
      localStorage.setItem('kayaAdminToken', res.token);
      state.adminToken=res.token; state.adminError='';
      await loadAdminData();
      state.step='adminPanel';
    }catch(err){ state.adminError=err.message; }
    render();
  };
  if(q('adminPin')) q('adminPin').onkeydown=(e)=>{ if(e.key==='Enter') q('adminSubmit').click(); };
  if(q('adminLogout')) q('adminLogout').onclick=()=>{
    localStorage.removeItem('kayaAdminToken');
    state.adminToken=null; state.step='landing'; render();
  };

  if(q('addStaffMember')) q('addStaffMember').onclick=async ()=>{
    const name=(q('newStaffName').value||'').trim();
    const pin=(q('newStaffPin').value||'').trim();
    if(!name || !pin){ state.staffAdminError='Name and PIN are required'; render(); return; }
    try{
      await api('/api/admin/staff','POST',{name,pin},state.adminToken);
      state.staffAdminError='';
      state.staffList=await api('/api/admin/staff','GET',null,state.adminToken);
    }catch(err){ state.staffAdminError=err.message; }
    render();
  };
  document.querySelectorAll('[data-remove-staff]').forEach(btn=>{
    btn.onclick=async ()=>{
      await api('/api/admin/staff/'+encodeURIComponent(btn.dataset.removeStaff),'DELETE',null,state.adminToken);
      state.staffList=await api('/api/admin/staff','GET',null,state.adminToken);
      render();
    };
  });

  document.querySelectorAll('[data-reset-pin-toggle]').forEach(btn=>{
    btn.onclick=()=>{
      const name=btn.dataset.resetPinToggle;
      state.resetPinFor = state.resetPinFor===name ? '' : name;
      state.resetPinValue=''; state.resetPinError='';
      render();
    };
  });
  document.querySelectorAll('[data-confirm-reset-pin]').forEach(btn=>{
    btn.onclick=async ()=>{
      const name=btn.dataset.confirmResetPin;
      const pin=(q('resetPinInput').value||'').trim();
      if(!pin){ state.resetPinError='Enter a new PIN'; render(); return; }
      try{
        await api('/api/admin/staff/'+encodeURIComponent(name)+'/pin','PATCH',{pin},state.adminToken);
        state.resetPinFor=''; state.resetPinValue=''; state.resetPinError='';
      }catch(err){ state.resetPinError=err.message; }
      render();
    };
  });

  if(q('resetPwSubmit')) q('resetPwSubmit').onclick=async ()=>{
    const card=(q('resetPwCardInput').value||'').trim().toUpperCase();
    const password=(q('resetPwPasswordInput').value||'').trim();
    state.resetPwCard=card; state.resetPwPassword=password;
    if(!card || !password){ state.resetPwError='Card number and new password are required'; state.resetPwMsg=''; render(); return; }
    try{
      const res=await api('/api/admin/members/'+encodeURIComponent(card)+'/reset-password','POST',{password},state.adminToken);
      state.resetPwError=''; state.resetPwMsg=`Password reset for ${res.name||card}.`; state.resetPwPassword='';
    }catch(err){ state.resetPwError=err.message; state.resetPwMsg=''; }
    render();
  };
}

async function loadAdminData(){
  state.adminStats=await api('/api/admin/stats','GET',null,state.adminToken);
  state.staffList=await api('/api/admin/staff','GET',null,state.adminToken);
}

async function init(){
  await loadRewards();

  const custToken=localStorage.getItem('kayaCustomerToken');
  if(custToken){
    try{
      const res=await api('/api/customer/me','GET',null,custToken);
      state.member=res.member; state.step='wallet';
    }catch(e){ localStorage.removeItem('kayaCustomerToken'); }
  }

  if(state.step==='landing'){
    const staffToken=localStorage.getItem('kayaStaffToken');
    const staffName=localStorage.getItem('kayaStaffName');
    if(staffToken && staffName){ state.staffToken=staffToken; state.staffName=staffName; state.step='staffLookup'; startStaffAlertPolling(); }
  }

  if(state.step==='landing'){
    const adminToken=localStorage.getItem('kayaAdminToken');
    if(adminToken){
      try{
        state.adminToken=adminToken;
        await loadAdminData();
        state.step='adminPanel';
      }catch(e){ localStorage.removeItem('kayaAdminToken'); }
    }
  }

  render();
}

if (location.protocol === 'file:') {
  // This file was opened directly (double-clicked) instead of through the
  // backend server, so relative /api/... calls can't reach anything and
  // everything below would fail with confusing "Failed to fetch" errors.
  document.getElementById('screen').innerHTML = `<div style="padding:40px 24px;text-align:center">
    <p style="font-size:32px;margin:0 0 14px">⚠️</p>
    <p style="color:${theme.ruby};font-size:16px;font-weight:700;margin:0 0 10px">This page needs to be served by the backend</p>
    <p style="color:${theme.textDim};font-size:13px;line-height:1.6;margin:0">You opened this HTML file directly. Go to the "backend" folder, run <b>npm install</b> then <b>npm start</b>, then open <b>http://localhost:3000</b> in your browser instead.</p>
  </div>`;
} else {
  init();
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
}
</script>
</body>
</html>
